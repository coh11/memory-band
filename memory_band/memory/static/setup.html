<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Band setup</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1d1f; --muted:#5f6368; --ok:#1e7d32; --bad:#c62828; --line:#e3dfd6; --accent:#2457c5; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:24px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:18px 18px 40px; }
  .top { display:flex; justify-content:space-between; align-items:center; font-size:18px; color:var(--muted); }
  .top a { color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:26px 22px; margin-top:14px; }
  h1 { font-size:36px; line-height:1.15; margin:0 0 10px; }
  .icon { font-size:64px; line-height:1; margin-bottom:8px; }
  .how { font-size:24px; }
  .dots { display:flex; gap:22px; justify-content:center; margin:28px 0 10px; }
  .dot { width:58px; height:58px; border-radius:50%; border:4px solid #cfc9bc; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:700; color:#b5ae9f; }
  .dot.on { background:var(--ok); border-color:var(--ok); color:#fff; }
  .dot.next { border-color:var(--accent); color:var(--accent); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform:scale(1.12); } }
  .count { text-align:center; font-size:22px; color:var(--muted); min-height:1.4em; }
  .msg { text-align:center; font-size:26px; font-weight:600; min-height:2.8em; margin:14px 0; }
  .msg.ok { color:var(--ok); } .msg.bad { color:var(--bad); }
  button { display:block; width:100%; font:inherit; font-size:26px; font-weight:650; border:0; border-radius:16px; padding:18px; margin-top:12px; background:var(--accent); color:#fff; cursor:pointer; }
  button.light { background:#ece8df; color:var(--ink); font-weight:500; }
  button.ok { background:var(--ok); }
  button[hidden] { display:none; }
  .steps { display:flex; gap:6px; margin-top:8px; }
  .steps span { flex:1; height:8px; border-radius:4px; background:#ddd7cb; }
  .steps span.on { background:var(--accent); } .steps span.done { background:var(--ok); }
  .warn { background:#fff1f1; border:2px solid #f1b5b5; color:var(--bad); border-radius:14px; padding:12px 14px; font-size:19px; margin-top:12px; }
  .warn code { font-size:16px; background:#fff; padding:2px 5px; border-radius:5px; }
  .small { font-size:18px; color:var(--muted); }
  :root { --bg:#faf8f3; --ok:#1d6b34; --accent:#1d6b34; --line:#d9d4c7; --ink:#111; --muted:#4b4b4b; }
  body { font-size:24px; color:#111; background:#faf8f3; }
  .card { border:1px solid var(--line); border-radius:6px; box-shadow:none; }
  .how { font-size:26px; line-height:1.45; }
  .icon { font-size:56px; }
  h1 { font-size:36px; }
  button { min-height:64px; font-size:26px; border-radius:6px; font-weight:600; }
  button.light { font-size:24px; background:#fff; border:1px solid #9c9585; }
  .dot { border-width:3px; } .dot.next { animation:none; border-color:var(--ok); color:var(--ok); }
  .steps span { height:10px; border-radius:2px; }
  .top { font-size:20px; font-weight:600; }
  .small { font-size:20px; margin-top:12px; }
  .warn { border-radius:6px; border-width:1px; }
  button:focus-visible, a:focus-visible { outline:3px solid #111; outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  .big-ok { font-size:90px; text-align:center; color:var(--ok); line-height:1; }

  /* polish */
  body { background:#f4f1ea; }
  .wrap { max-width:620px; padding:28px 20px 56px; }
  .top { font-size:19px; font-weight:600; color:#4b4b4b; margin-bottom:10px; }
  .top a { color:#1d6b34; font-weight:600; }
  .steps { gap:8px; margin:0 0 6px; }
  .steps span { height:8px; border-radius:4px; background:#dcd6c8; }
  .steps span.on { background:#1d6b34; } .steps span.done { background:#7fae8b; }
  .card { border-radius:14px; padding:36px 32px 30px; margin-top:18px; border:1px solid #e2ddd1; }
  .badge { width:96px; height:96px; border-radius:50%; background:#eef4ee; display:flex; align-items:center; justify-content:center; font-size:50px; margin:0 0 22px; }
  .kicker { font-size:18px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#1d6b34; margin-bottom:6px; }
  h1 { font-size:38px; letter-spacing:-.01em; margin:0 0 14px; }
  .how { font-size:25px; color:#222; }
  .tip { background:#f7f4ec; border-left:4px solid #c9b98f; border-radius:6px; padding:14px 16px; font-size:20px; color:#3d3d3d; margin-top:24px; }
  .tip b { color:#111; }
  .dots { gap:18px; margin:32px 0 6px; }
  .dot { width:64px; height:64px; border:3px solid #cfc9bc; background:#fff; font-size:26px; color:#9a9384; }
  .dot.on { background:#1d6b34; border-color:#1d6b34; color:#fff; }
  .dot.next { border-color:#1d6b34; color:#1d6b34; box-shadow:0 0 0 6px #e3efe5; }
  .msg { font-size:25px; min-height:2.4em; margin:12px 0 8px; display:flex; align-items:center; justify-content:center; }
  button { background:#1d6b34; min-height:68px; border-radius:10px; font-size:27px; margin-top:14px; }
  button:hover { background:#175a2b; }
  button.light { background:#fff; color:#1d1d1f; border:1.5px solid #b9b2a2; font-size:22px; min-height:58px; font-weight:600; }
  button.light:hover { background:#f6f3ec; }
  .row { display:flex; gap:12px; } .row button { flex:1; }
  .warn { background:#fff8e6; border:1px solid #e7cf8a; color:#5c4400; border-radius:10px; padding:16px 18px; font-size:21px; margin-top:16px; }
  .warn .techy { display:block; margin-top:8px; font-size:15px; color:#7a6a3a; }
  .list { margin:22px 0 4px; border-top:1px solid #ebe6db; }
  .list div { display:flex; align-items:center; gap:14px; padding:13px 2px; border-bottom:1px solid #ebe6db; font-size:23px; }
  .list .ic { width:40px; text-align:center; font-size:28px; }
  .list .opt { margin-left:auto; font-size:17px; color:#6b6b6b; }
  .list .yes { margin-left:auto; color:#1d6b34; font-weight:700; font-size:20px; }
  .pill { display:inline-block; margin-top:22px; padding:8px 16px; border-radius:999px; font-size:19px; font-weight:600; }
  .pill.ok { background:#e6f1e8; color:#1d6b34; } .pill.bad { background:#fbeaea; color:#a12a2a; }
  .big-ok { width:110px; height:110px; border-radius:50%; background:#1d6b34; color:#fff; font-size:64px; display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
  .center { text-align:center; }
  h2 { font-size:28px; margin:34px 0 8px; }
  @media (max-width:520px) { .card { padding:26px 20px; } h1 { font-size:32px; } .how { font-size:23px; } .row { flex-direction:column; gap:0; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span id="where">Memory Band setup</span><a href="/">Dashboard</a></div>
  <div class="steps" id="bar"></div>
  <div id="listener" class="warn" hidden></div>
  <div class="card" id="screen"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const STEPS = [
  { key: "welcome" },
  { key: "lock", icon: "🔒", title: "Door lock sound", how: "Stand at your front door with the band on the wrist you lock with. Press Start, then lock the door. Do it 3 times.", tip: "Unlock it again between tries. A quiet moment helps." },
  { key: "twist", icon: "🗝️", title: "Key turn", how: "Press Start, then turn the key in the lock, just like locking it. Do it 3 times.", tip: "Turn back between tries and pause a second." },
  { key: "pill", icon: "💊", title: "Pill bottle", how: "Press Start, then pick up your pill bottle and shake out a pill. Do it 3 times.", tip: "Put the pill back each time. Use your usual bottle." },
  { key: "setdown", icon: "📱", title: "Phone set-down", how: "Press Start, then put your phone down on a table, like at a café. Do it 3 times.", tip: "Pick it up again between tries." },
  { key: "flush", icon: "🚽", title: "Toilet flush (optional)", how: "Works without this. To make it more accurate: press Start, then flush your toilet. Do it 3 times.", tip: "Wait for the tank to refill between flushes (about a minute). Skip to use the built-in default." },
  { key: "paper", icon: "🧻", title: "Toilet paper (optional)", how: "Works without this. Press Start, then pull some toilet paper off the roll and tear it. Do it 3 times.", tip: "Used for the \"forgot to flush\" reminder. Skip to use the built-in default." },
  { key: "done" },
];
const qs = new URLSearchParams(location.search).get("step");
let step = qs !== null ? Number(qs) : Number(localStorage.getItem("mb-setup-step") || 0);
let status = { calibration: {}, listener_alive: false, calibrated: {} };
let mine = null;            // id of the calibration this page started
let test = null;            // live test: { since, result }

async function api(path, body) {
  const r = await fetch("/api" + path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.ok ? r.json() : null;
}
function go(n) { step = Math.max(0, Math.min(STEPS.length - 1, n)); localStorage.setItem("mb-setup-step", step); mine = null; test = null; draw(); }
function button(label, fn, cls) { const b = el("button", cls || "", label); b.onclick = fn; return b; }

function drawBar() {
  const bar = $("bar"); bar.replaceChildren();
  STEPS.forEach((s, i) => bar.append(el("span", i < step ? "done" : (i === step ? "on" : ""))));
  const lw = $("listener");
  lw.hidden = status.listener_alive;
  if (!status.listener_alive) {
    const t = el("span", "techy"); t.append(document.createTextNode("For the helper: on the home computer, run "), el("code", null, ".venv/bin/python memory_band/band_bridge.py"));
    lw.replaceChildren(el("b", null, "The band isn't connected yet. "), document.createTextNode("Tap the band twice and keep it close to the computer."), t);
  }
}

function drawWelcome(card) {
  card.append(el("div", "badge", "⌚"), el("h1", null, "Let's teach the band your home"));
  card.append(el("div", "how", "You'll do a few everyday things, three times each, so the band learns how they look and sound in your home. It takes about 3 minutes."));
  const list = el("div", "list");
  STEPS.slice(1, -1).forEach((x) => { const r = el("div"); r.append(el("span", "ic", x.icon), el("span", null, x.title.replace(" (optional)", "")));
    if (status.calibrated[x.key]) r.append(el("span", "yes", "Done ✓")); else if (x.title.includes("optional")) r.append(el("span", "opt", "Optional")); list.append(r); });
  card.append(list);
  const b = status.band || {};
  card.append(el("div", "pill " + (b.connected ? "ok" : "bad"), b.connected ? "● Band connected" : "● Band not connected yet"));
  card.append(button("Let's start", () => go(1)));
  card.append(el("div", "tip", "Not sure about a step? You can skip it. The band already knows what most of these sound like."));
}

function drawCalibration(card, s) {
  const cal = status.calibration || {};
  const live = mine && cal.id === mine ? cal : null;
  const n = live ? (live.samples || 0) : 0;
  const state = live ? live.state : (status.calibrated[s.key] ? "saved" : "idle");
  card.append(el("div", "badge", s.icon), el("div", "kicker", `Step ${step} of ${STEPS.length - 2}` + (s.title.includes("optional") ? " · Optional" : "")), el("h1", null, s.title.replace(" (optional)", "")), el("div", "how", s.how));
  const dots = el("div", "dots");
  for (let i = 0; i < 3; i++) {
    const done = state === "done" || state === "saved" || i < n;
    const next = !done && ["recording", "sample", "waiting"].includes(state) && i === n;
    dots.append(el("div", "dot" + (done ? " on" : (next ? " next" : "")), done ? "✓" : String(i + 1)));
  }
  card.append(dots);
  card.append(el("div", "count", ["recording", "sample"].includes(state) ? `${n} of 3 recorded` : ""));
  let msg = "", cls = "";
  if (state === "idle") msg = "Press Start when you're ready.";
  if (state === "saved") { msg = "Already set up ✓  (Redo to record again)"; cls = "ok"; }
  if (state === "waiting") msg = status.listener_alive ? "Getting the band ready…" : "Waiting for the band listener…";
  if (state === "recording" || state === "sample") msg = n === 0 ? "Listening… go ahead, do it now." : `Got it! Now number ${n + 1}.`;
  if (state === "done") { msg = "All 3 recorded. Saved ✓"; cls = "ok"; }
  if (state === "default") { msg = "Using the default ✓"; cls = "ok"; }
  if (state === "failed" || state === "cancelled") { msg = live.message || "That didn't work. Try Redo."; cls = "bad"; }
  card.append(el("div", "msg " + cls, msg));
  const busy = ["waiting", "recording", "sample"].includes(state);
  const start = async () => { const r = await api("/calibrate/start", { action: s.key }); if (r) mine = r.id; poll(); };
  if (state === "idle") card.append(button("Start", start));
  if (state === "done" || state === "saved" || state === "default") card.append(button("Next", () => go(step + 1), "ok"));
  if (!busy && state !== "idle") card.append(button("Try again", start, "light"));
  if (busy) card.append(button("Stop", async () => { await api("/calibrate/cancel", {}); poll(); }, "light"));
  const row = el("div", "row");
  if (step > 1 && !busy) row.append(button("Back", () => go(step - 1), "light"));
  if (state !== "done" && state !== "default") row.append(button("Skip, use the default", async () => {
    const r = await api("/calibrate/default", { action: s.key }); if (r) mine = r.id; setTimeout(() => go(step + 1), 900); poll(); }, "light"));
  if (row.children.length) card.append(row);
  const tip = el("div", "tip"); tip.append(el("b", null, "Tip: "), document.createTextNode(s.tip)); card.append(tip);
}

function drawDone(card) {
  card.append(el("div", "big-ok", "✓"), el("h1", "center", "You're all set"));
  card.append(el("div", "how center", "The band now knows your home. You don't need to do anything else."));
  const ul = el("div", "list");
  STEPS.slice(1, -1).forEach((x) => { const r = el("div"); r.append(el("span", "ic", x.icon), el("span", null, x.title.replace(" (optional)", "")),
    el("span", status.calibrated[x.key] ? "yes" : "opt", status.calibrated[x.key] ? "Learned ✓" : "Using default")); ul.append(r); });
  card.append(ul);
  card.append(el("h2", null, "Try it once"));
  if (!test) {
    card.append(el("div", "how", "Lock the door once, with the band on."));
    card.append(button("Test it now", async () => { const st = await api("/state"); test = { since: st ? st.now - 1 : Date.now() / 1000, result: null }; draw(); }));
  } else {
    let msg = "Listening… lock the door now.", cls = "";
    if (test.result === "locked") { msg = "Door lock recognized ✓"; cls = "ok"; }
    if (test.result === "click") msg = "Heard a click. Turn the key as well (or Redo the lock sound).";
    if (test.result === "twist") msg = "Felt a key turn. Listening for the click…";
    card.append(el("div", "msg " + cls, msg));
    card.append(button(test.result === "locked" ? "Test again" : "Restart test", async () => { const st = await api("/state"); test = { since: st.now - 1, result: null }; draw(); }, "light"));
  }
  card.append(button("Go to my home screen", () => { location.href = "/"; }));
  card.append(button("Go through setup again", () => go(1), "light"));
}

function draw() {
  drawBar();
  const card = $("screen"); card.replaceChildren();
  const s = STEPS[step];
  $("where").textContent = "Memory Band setup";
  if (s.key === "welcome") drawWelcome(card);
  else if (s.key === "done") drawDone(card);
  else drawCalibration(card, s);
}

async function poll() {
  const st = await api("/calibrate/status");
  if (st) status = st;
  if (test && !test.result || (test && test.result !== "locked")) {
    const s = await api("/state");
    if (s) {
      const evs = s.timeline.filter((e) => e.ts >= test.since);
      if (evs.some((e) => e.kind === "door_locked" || e.kind === "lock_sound")) test.result = "locked";
      else if (evs.some((e) => e.kind === "click")) test.result = "click";
      else if (evs.some((e) => e.kind === "lock_twist")) test.result = "twist";
    }
  }
  draw();
}
draw(); poll(); setInterval(poll, 800);
</script>
</body>
</html>
